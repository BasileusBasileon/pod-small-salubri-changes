l_english: 
 rule_pod_salubri_third_eye: "$POD_gamerule$ Salubri Third Eye"
 setting_pod_salubri_third_eye_valeren: "Valeren"
 setting_pod_salubri_third_eye_valeren_desc: "The Salubris Third Eye will be shown for any character that has a Valeren perk of the third level."
 setting_pod_salubri_third_eye_salubri: "Salubri"
 setting_pod_salubri_third_eye_salubri_desc: "The Salubris Third Eye will always be shown for all Salubri and nobody else."

 undergo_the_blooding_decision: "Undergo the Blooding"
 undergo_the_blooding_decision_desc: "The Blooding is the name of the Ritual that Salubri Warriors undergo to be initiated into the Caste. The exact nature of this Ritual has been lost over time, fragmented together with the Code of Samiel. \n\nIf you can decipher the writings of the Code together with one of them, perhaps you can pierce together the whole Ritual and join the illustrious ranks of the Warriors:\nThe Baali slayers. The ones who still fight against the Usurpers.\nTill the bitter, bitter End."
 undergo_the_blooding_decision_tooltip: "#help \"I was at once terribly aware of my unliving state, and yet I had little concern for it. My spirit seemed to open, and the wound on it made by my Embrace was whipped into bleeding. Then did something greater than myself offer me to drink, bidding me that I should do so and without fear. This I did, and it was as though I had been brought to the Embrace by every thing I did hold sacred to myself.\"#!\n- Salubri Elder"
 undergo_the_blooding_decision_confirm: "Perform the Ritual"
 undergo_the_blooding_decision_confirm: "Perform the Ritual"
 salubri_warrior_positive_relationship_and_code_desc: "One of your positive relationships must be a Salubri Warrior and either they or you must own the complete Code of Samiel.\nTheir [learning|E] must be [learning_i] #V 15#! or above OR they must know [GetCultureByKey('enochian').GetLanguage.GetName]"
 salubri_changes_take_angelic_name: "You will take an angelic name"

 POD_salubri_changes.1.title: "Setting Up"
 POD_salubri_changes.1.desc: "You and [warrior.GetFirstName] have carefully studied the Code of Samiel, discerning all the parts of the Bloodening Ritual used to initiate Salubri into the Warriors. Following its directions you two have come to a remote Forest, alone, and prepared a small circle in the ground.\n\nNow is the time to decide whether you will actually go through with this. You can never go back to your old Caste if you complete this Ritual."
 POD_salubri_changes.1.option.a: "Let us begin."
 POD_salubri_changes.1.option.a.tt: "You start the Ritual ..."
 POD_salubri_changes.1.option.b: "I don't think I am ready yet."
 POD_salubri_changes.1.option.c: "This feels like a bad idea ..."
 POD_salubri_changes.2.title: "The Ritual"
 POD_salubri_changes.2.desc: "As the Code commands, you strip to your skin and lay everything your brought with you at [warrior.GetFirstNamePossessive] feet.\nThen, you join together in prayer for a few hours, kneeling in the dust, nothing around you but the cold, quiet night.\n\nWhen this is done, you step into the circle prepared by [warrior.GetFirstName], after which [warrior.GetSheHe] starts walking around you, needling you with questions:\nAbout the Code. About the Clan. About you. About what you know. In Hebrew. In Enochian.\n\nYou answer as best you can, any mistake or hesitation answered with a lash.\nYou know that this is a test of your rage, but that doesn't make it any less difficult to resist.\nAfter what feels like an hour [warrior.GetSheHe] finally stops, only to then ask you to recite the Code of Samiel.\n\nYou do.\n\n#help \“Who are you, who claims that you will hold this Code as dear as your own life-blood? Who are you that would serve the Lord and be numbered as of Samiels lineage?\"#!\n\nBefore the Ritual you had thought about what Name you might want to be known by after the Blooding, but you can't remember ... and then it comes to you."
 POD_salubri_changes.2.option.a: "I am [Localize(SCOPE.GetFlagName('saved_tooltip'))|P]!"
 POD_salubri_changes.3.title: "The Ritual"
 POD_salubri_changes.3.desc: "As the Code commands, you strip to your skin and lay everything your brought with you at [warrior.GetFirstNamePossessive] feet.\nThen, you join together in prayer for a few hours, kneeling in the dust, nothing around you but the cold, quiet night. #N You feel uncomfortable.#!\n\nWhen this is done, you step into the circle prepared by [warrior.GetFirstName], after which they start walking around you, needling you with questions:\nAbout the Code. About the Clan. About you. About what you know. In Hebrew. In Enochian.\n\nYou answer as best you can, any mistake or hesitation answered with a lash. #N And you make a lot of mistakes.#!\nYou know that this is a test of your rage, but that doesn't make it any less difficult to resist, #N but you barely hang on#!.\nAfter what feels like an hour [warrior.GetSheHe] finally stops, only to then ask you to recite the Code of Samiel.\n\n#N After some hesitation,#! you do.\n#help \“Who are you, who claims that you will hold this Code as dear as your own life-blood? Who are you that would serve the Lord and be numbered as of Samiels lineage?\"#!\nBefore the Ritual you had thought about - #X Wait, what is this?! IT BURNS!#!\n\n#X #bold \"BEGONE, SERVANT OF THE FALLEN!\"#! #!"
 POD_salubri_changes.3.option.a: "Argghh!"
 POD_salubri_changes.3.option.a.tt: "What did you think would happen to an infernalist trying to become part of a Bloodline dedicated to hunting you?"

